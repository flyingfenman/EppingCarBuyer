name: Validate booking branch

on:
  push:
    branches:
      - "chatgpt/simplify-mobile-booking-20260930"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
