name: Generate crisp inspection icons

on:
  push:
    branches:
      - "chatgpt/crisp-individual-inspection-icons-20260930"

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[icons-generated]') }}
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: sk_test_placeholder_for_build_only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install pillow requests numpy

      - name: Download and recolour original icon artwork
        shell: bash
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import requests
          import numpy as np
          from PIL import Image

          root = "https://www.vehicleinspect.com.au/wp-content/uploads/2024/03/"
          files = {
              "battery": "BatteryIcon.webp",
              "fuel-system": "Fuel-system-operationIcon.webp",
              "cv-joints": "CV-Jointboots-drive-shaft-and-universal-jointsIcon.webp",
              "ball-joint": "Ball-joint-and-tie-rod-endsIcon.webp",
              "tail-lights": "Tail-LightsIcon.webp",
              "coolant-recovery": "Coolant-recovery-tankIcon.webp",
              "engine-transmission-leaks": "Engine-transmission-leaks-and-faultsIcon.webp",
              "brake-pad-rotor": "Brake-pad-and-rotor-conditionIcon.webp",
              "alternator": "AlternatorIcon.webp",
              "engine-valve-noise": "Engine-valve-noiseIcon.webp",
              "cooling-fan": "Cooling-fan-operationIcon.webp",
              "transfer-case": "Transfer-case-conditionIcon.webp",
              "brake-caliper": "Brake-caliper-leakageIcon.webp",
              "power-steering": "Power-steeringIcon.webp",
              "engine-transmission-mount": "Enginetransmission-mount-conditionIcon.webp",
              "ac-compressor": "AC-compressor-operation.webp",
              "tyre-condition": "Tyre-conditionIcon.webp",
              "suspension": "SuspensionIcon.webp",
              "ac-condenser": "AC-condenserIcon.webp",
              "bushing-condition": "Bushing-conditionIcon.webp",
              "carpet-condition": "Carpet-condition.webp",
              "steering-wheel": "Steering-wheel-condition.webp",
              "air-vents": "Air-vents.webp",
              "electric-windows": "Electric-windows.webp",
              "interior-lights": "Interior-lights.webp",
              "seat-belts": "Seat-belts.webp",
              "wipers": "Wipers.webp",
              "horn": "Horn.webp",
              "exterior-mirrors": "Exterior-mirrors.webp",
              "dashboard": "Dash-board-condition.webp",
              "ac-operation": "AC-operation.webp",
              "heater-operation": "Heater-operation.webp",
              "fuel-temperature-gauges": "Fuel-temperature-gauges.webp",
              "park-brake": "Park-brake.webp",
              "major-body-repairs": "Major-body-repairsIcon.webp",
              "reverse-lights": "Reverse-LightsIcon.webp",
              "number-plate-lights": "Number-plate-lights_Icon.webp",
              "scratches-dints": "Scratches-and-DintsIcon.webp",
              "hazard": "HazardIcon.webp",
              "headlights": "HeadLightsIcon.webp",
              "paint-depth": "Paint-depth-testing-to-all-panelsIcon.webp",
              "fog-lamp": "Fog-LampIcon.webp",
              "door-operations": "Door-operationsIcon.webp",
              "turn-signals": "Turn-signals-opearationIcon.webp",
          }

          out = Path("public/images/inspection-icons")
          out.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; EppingCarBuyerAssetBuild/1.0)",
              "Referer": "https://www.vehicleinspect.com.au/what-we-inspect/",
          })

          target = np.array([97.0, 27.0, 167.0])
          source = np.array([232.0, 57.0, 44.0])
          white = np.array([255.0, 255.0, 255.0])

          for slug, filename in files.items():
              response = session.get(root + filename, timeout=30)
              response.raise_for_status()
              image = Image.open(BytesIO(response.content)).convert("RGBA")
              arr = np.asarray(image).copy().astype(np.float32)
              rgb = arr[:, :, :3]
              r, g, b = rgb[:, :, 0], rgb[:, :, 1], rgb[:, :, 2]
              red = (r > g * 1.18) & (r > b * 1.18) & (r > 120) & ((r - g) > 25) & ((r - b) > 25)
              tg = (255.0 - g) / (255.0 - source[1])
              tb = (255.0 - b) / (255.0 - source[2])
              opacity = np.clip((tg + tb) / 2.0, 0.0, 1.0)
              for channel in range(3):
                  rgb[:, :, channel][red] = white[channel] * (1.0 - opacity[red]) + target[channel] * opacity[red]
              arr[:, :, :3] = rgb
              result = Image.fromarray(np.clip(arr, 0, 255).astype(np.uint8), "RGBA")
              result.save(out / f"{slug}.png", optimize=True)
              if result.width < 120 or result.height < 120:
                  raise RuntimeError(f"{slug} downloaded too small: {result.size}")

          print(f"Generated {len(files)} full-resolution local icons")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Validate production build
        run: npm run build

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/inspection-icons
          if git diff --cached --quiet; then
            echo "No generated asset changes"
            exit 0
          fi
          git commit -m "[icons-generated] Generate crisp inspection icon assets"
          git push origin HEAD:"${GITHUB_REF_NAME}"
